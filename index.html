<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Molecule3D — 3D Molecular Models</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0e14; color: #e8e8f0; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 320px; min-width: 260px; background: #12161f; border-right: 1px solid #232937;
    display: flex; flex-direction: column; padding: 18px; gap: 14px; overflow-y: auto;
  }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px; }
  h1 span { color: #5b9dff; }
  .subtitle { font-size: 0.78rem; color: #7a8199; margin-top: -8px; }
  .search-row { display: flex; gap: 8px; }
  #input {
    flex: 1; padding: 10px 12px; background: #1a2030; border: 1px solid #2a3245; border-radius: 8px;
    color: #e8e8f0; font-size: 0.9rem; outline: none;
  }
  #input:focus { border-color: #5b9dff; }
  #goBtn {
    padding: 10px 16px; background: #3d6fe0; color: white; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600; font-size: 0.9rem;
  }
  #goBtn:hover { background: #5285f5; }
  .hint { font-size: 0.72rem; color: #6b7288; line-height: 1.5; }
  .hint code { background: #1a2030; padding: 1px 5px; border-radius: 4px; color: #9db4e8; }
  #error { color: #ff6b6b; font-size: 0.8rem; min-height: 1em; }
  .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: #7a8199; margin-top: 6px; }
  #molList { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px; background: #1a2030; border: 1px solid #2a3245; border-radius: 14px;
    font-size: 0.78rem; cursor: pointer; transition: background 0.15s;
  }
  .chip:hover { background: #253048; border-color: #3d6fe0; }
  .controls { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .controls label { font-size: 0.8rem; color: #aab; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  select {
    padding: 6px 8px; background: #1a2030; color: #e8e8f0; border: 1px solid #2a3245; border-radius: 6px; font-size: 0.85rem;
  }
  #info {
    background: #1a2030; border: 1px solid #2a3245; border-radius: 10px; padding: 12px;
    font-size: 0.82rem; line-height: 1.7; display: none;
  }
  #info b { color: #5b9dff; }
  #viewport { flex: 1; position: relative; }
  #viewport canvas { display: block; }
  #hud {
    position: absolute; top: 12px; right: 14px; font-size: 0.75rem; color: #6b7288;
    background: rgba(18, 22, 31, 0.8); padding: 6px 10px; border-radius: 6px;
  }
  @media (max-width: 640px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; height: 45%; border-right: none; border-bottom: 1px solid #232937; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div>
      <h1>Molecule<span>3D</span></h1>
      <div class="subtitle">formula / name / SMILES → 3D model</div>
    </div>

    <div class="search-row">
      <input id="input" placeholder="e.g. water, C6H6, caffeine, CCO" autofocus>
      <button id="goBtn">Build</button>
    </div>
    <div id="error"></div>

    <div class="hint">
      Try a <b>name</b> (water, caffeine), a <b>formula</b> (H2O, C6H12O6, Ca(OH)2),
      or a <b>SMILES</b> string (<code>CC(=O)O</code>, <code>c1ccccc1</code>).
    </div>

    <div id="info"></div>

    <div class="section-label">Style</div>
    <select id="style">
      <option value="ball-stick">Ball &amp; stick</option>
      <option value="space-fill">Space-fill (CPK)</option>
      <option value="wireframe">Wireframe</option>
    </select>

    <div class="controls">
      <label><input type="checkbox" id="spin" checked> Auto-rotate</label>
    </div>

    <div class="section-label">Quick picks</div>
    <div id="molList"></div>

    <div class="hint" style="margin-top:auto">
      Drag to rotate · scroll to zoom · right-drag / shift-drag to pan
    </div>
  </div>
  <div id="viewport"><div id="hud">drag · scroll · shift-drag</div></div>
</div>

<script src="three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/geometry.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
